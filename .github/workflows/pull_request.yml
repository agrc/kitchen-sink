name: Pull Request Events

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧼 Lint files
        run: pnpm lint

      - name: ✔ Check Types and Formatting
        run: pnpm check

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Run build script
        run: pnpm build

      - name: 🧪 Run tests
        run: pnpm test

  deploy-storybook:
    name: 📚 Deploy documentation
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    if: ${{ github.event.sender.type == 'User' }}
    permissions:
      id-token: write
      pull-requests: write
    environment:
      name: dev

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: 🚀 Deploy
        uses: agrc/firebase-website-deploy-composite-action@v2
        with:
          identity-provider: ${{ secrets.IDENTITY_PROVIDER }}
          service-account-email: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project-id: ${{ secrets.PROJECT_ID }}
          preview: "yes"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          prebuild-command: pnpm --filter @ugrc/utilities build && pnpm build
          build-command: pnpm build:storybook
        env:
          VITE_QUAD_WORD: ${{ secrets.DISCOVER_QUAD_WORD }}
